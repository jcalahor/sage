[package]
name = "sage_worker"
version = "0.1.0"
edition = "2024"

[dependencies]
task = { path = "../task" }
tasks_impl = { path = "../tasks_impl" }
tokio = { version = "1", features = ["full"] }
rdkafka = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
# Environment variables
dotenvy = "0.15"
# Logging
log = "0.4"
simplelog = "0.12"
